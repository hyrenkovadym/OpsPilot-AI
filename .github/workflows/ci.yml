name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER: mock
      OPENAI_API_KEY: ""
      QUEUE_MODE: sync
      REALTIME_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w @opspilot/api

      - name: Lint API
        run: npm run lint -w @opspilot/api

      - name: Run API tests
        run: npm run test -w @opspilot/api

      - name: Build API
        run: npm run build -w @opspilot/api

      - name: Build Web
        run: npm run build -w @opspilot/web

