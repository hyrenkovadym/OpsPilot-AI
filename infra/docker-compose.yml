services:
  postgres:
    image: postgres:16-alpine
    container_name: opspilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: opspilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - opspilot-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d opspilot']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: opspilot-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: opspilot-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/opspilot
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
      CORS_ORIGIN: http://localhost:3000
      AI_PROVIDER: mock
      OPENAI_API_KEY: ''
      OPENAI_BASE_URL: https://api.openai.com/v1
      OPENAI_MODEL: gpt-4o-mini
      OPENAI_TIMEOUT_SECONDS: 20
      OPENAI_MAX_RETRIES: 1
      QUEUE_MODE: async
      BULLMQ_REDIS_URL: redis://redis:6379
      BULLMQ_DEFAULT_ATTEMPTS: 3
      BULLMQ_BACKOFF_MS: 5000
      REALTIME_ENABLED: true
      SOCKET_CORS_ORIGIN: http://localhost:3000
    command: sh -c "npx prisma db push && node dist/main.js"
    ports:
      - '4000:4000'

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: opspilot-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/opspilot
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
      CORS_ORIGIN: http://localhost:3000
      AI_PROVIDER: mock
      OPENAI_API_KEY: ''
      OPENAI_BASE_URL: https://api.openai.com/v1
      OPENAI_MODEL: gpt-4o-mini
      OPENAI_TIMEOUT_SECONDS: 20
      OPENAI_MAX_RETRIES: 1
      QUEUE_MODE: async
      BULLMQ_REDIS_URL: redis://redis:6379
      BULLMQ_DEFAULT_ATTEMPTS: 3
      BULLMQ_BACKOFF_MS: 5000
      REALTIME_ENABLED: true
      SOCKET_CORS_ORIGIN: http://localhost:3000
    command: sh -c "npx prisma db push && node dist/worker.js"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: opspilot-web
    restart: unless-stopped
    depends_on:
      - api
      - worker
    environment:
      NODE_ENV: development
    ports:
      - '3000:3000'

volumes:
  opspilot-postgres-data:

